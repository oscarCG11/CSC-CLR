<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de documentos PDF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div>
            <span class="eyebrow">Archivo compartido</span>
            <h1>Historial de documentos PDF</h1>
            <p>Consulta y conserva los documentos de todas las sucursales en un solo lugar.</p>
        </div>
        <button class="btn-secundario" type="button" onclick="regresarMenu()">Menu principal</button>
    </header>
    <main>
        <section class="panel carga">
            <div>
                <h2>Guardar un documento</h2>
                <p class="ayuda">Los archivos se guardan en el servidor para que cualquier usuario de la red pueda consultarlos.</p>
            </div>
            <form id="formularioDocumento">
                <label>Archivo PDF *<input id="archivoPdf" type="file" accept="application/pdf,.pdf" required></label>
                <label>Sucursal
                    <select id="sucursal">
                        <option>Super Carnes el Colorado</option>
                        <option>Carnes Selectas los Reyes</option>
                        <option>Todas las sucursales</option>
                    </select>
                </label>
                <label>Descripción <input id="descripcion" type="text" maxlength="300" placeholder="Ej. Checklist mensual"></label>
                <button class="btn-principal" type="submit">Guardar PDF</button>
            </form>
            <p id="mensaje" class="mensaje" role="status"></p>
        </section>
        <section class="panel">
            <div class="titulo-lista">
                <div><span class="eyebrow">Registro central</span><h2>Documentos guardados</h2></div>
                <button class="btn-secundario" type="button" onclick="cargarDocumentos()">Actualizar</button>
            </div>
            <div id="listaDocumentos" class="lista-documentos"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
